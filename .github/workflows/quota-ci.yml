name: Quota App CI

on:
  push:
    paths:
      - "apps/auxdisp-codex-quota/**"
      - "docs/**"
      - "AGENTS.md"
      - "README.md"
      - ".gitignore"
      - "LICENSE"
      - ".github/workflows/quota-ci.yml"
  pull_request:
    paths:
      - "apps/auxdisp-codex-quota/**"
      - "docs/**"
      - "AGENTS.md"
      - "README.md"
      - ".gitignore"
      - "LICENSE"
      - ".github/workflows/quota-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build-install:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/auxdisp-codex-quota
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: apps/auxdisp-codex-quota/uv.lock
      - run: uv sync --locked --all-groups --no-sources
      - run: uv run --locked --no-sources ruff check src tests
      - run: uv run --locked --no-sources pytest
      - name: Render synthetic previews without USB or account access
        run: |
          uv run --locked --no-sources auxdisp-codex-quota --preview previews/dual.png
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --locked --no-sources auxdisp-codex-quota --preview previews/single.png --account-index 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --locked --no-sources auxdisp-codex-quota --preview previews/error.png --simulate-error
      - run: uv build --no-sources
      - name: Install app wheel with driver resolved from PyPI
        run: |
          uv venv .venv-wheel --python 3.13
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheel = Get-ChildItem dist/*.whl | Select-Object -First 1 -ExpandProperty FullName
          uv pip install --python .venv-wheel/Scripts/python.exe --index-url https://pypi.org/simple $wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./.venv-wheel/Scripts/python.exe -c "from importlib.metadata import distribution; import auxdisp_codex_quota, auxdisp_driver; from pathlib import Path; assert '.venv-wheel' in str(Path(auxdisp_codex_quota.__file__).resolve()); assert distribution('auxdisp-driver').read_text('direct_url.json') is None"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./.venv-wheel/Scripts/auxdisp-codex-quota.exe --preview previews/installed-wheel.png
      - uses: actions/upload-artifact@v4
        with:
          name: quota-app-previews
          path: apps/auxdisp-codex-quota/previews/*.png
          if-no-files-found: error
