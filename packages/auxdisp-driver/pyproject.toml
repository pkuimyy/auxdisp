[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auxdisp-driver"
version = "0.1.0"
description = "Standalone Python drivers for Turing, XuanFang, WeAct and compatible smart displays"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE.md"]
dependencies = [
  "numpy>=2.0.2",
  "Pillow>=11.1.0",
  "pyserial>=3.5",
  "pyusb>=1.3.1",
  "pycryptodome>=3.23.0",
  "libusb-package>=1.0.30.0,<2",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["src/auxdisp_driver/lcd"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.11"]

[tool.uv]
required-version = "==0.13.7"
