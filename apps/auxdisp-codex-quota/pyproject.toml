[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auxdisp-codex-quota"
version = "0.1.3"
description = "Multi-account Codex quota display for Turing USB 5.2-inch screens"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "auxdisp-driver>=0.1.0,<0.2.0",
    "pillow>=11.1.0",
    "pywin32>=311; sys_platform == 'win32'",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.scripts]
auxdisp-codex-quota = "auxdisp_codex_quota.cli:main"

[project.urls]
Repository = "https://github.com/pkuimyy/auxdisp"
Documentation = "https://github.com/pkuimyy/auxdisp/blob/main/apps/auxdisp-codex-quota/docs/en/README.md"
Issues = "https://github.com/pkuimyy/auxdisp/issues"
Changelog = "https://github.com/pkuimyy/auxdisp/blob/main/apps/auxdisp-codex-quota/docs/en/CHANGELOG.md"
Releases = "https://github.com/pkuimyy/auxdisp/releases"

[tool.setuptools.package-data]
auxdisp_codex_quota = ["data/*.json"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.11"]

[tool.uv]
required-version = "==0.13.7"
